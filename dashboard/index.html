<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ragOps local workbench</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body><main><h1>ragOps local workbench</h1><p>Offline synthetic data only. Role switching demonstrates filtering, not authentication. Retrieved text is untrusted.</p><section><h2>Document and chunk explorer</h2><label>Simulated role <select id="role"></select></label><div id="documents"></div></section><section><h2>Retrieval playground</h2><form id="search"><label>Query <input id="query" maxlength="4096" value="vacation annual leave" required></label><label>Strategy <select id="strategy"><option value="lexical">BM25</option><option value="offline">Offline hash</option><option value="hybrid">Hybrid</option></select></label><label>Top K <input id="k" type="number" min="1" max="100" value="5" required></label><label>Text budget <input id="budget" type="number" min="0" max="100000" value="400" required></label><button>Retrieve</button></form><h3>Ranked results</h3><div id="results"></div><h3>Verified context and citations</h3><pre id="context"></pre></section><section><h2>Experiment comparisons</h2><button id="compare">Run synthetic benchmark</button><div id="experiments"></div></section><section><h2>Enterprise acceptance scenarios</h2><button id="scenarios">Run scenarios</button><pre id="scenario-output"></pre></section><p id="status" role="status"></p></main></body></html>
